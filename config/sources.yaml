# AIC-NewsBrief 数据源配置
#
# 本文件中的 enabled 状态全部基于 2026-09-24 在本机的实测结果
# （health 体检 + 24 个候选 URL 探测），不是猜测。详见 docs/技术报告.md。
#
# 字段说明：
#   id        唯一标识，命令行 -s 用它
#   name      展示名，会写进简报的来源标注
#   region    cn = 中国大陆 / intl = 境外
#   lang      zh / en
#   tier     1 = 官方权威（国防部、中国军网、新华网等）
#            2 = 主流媒体（人民网、中新网、Defense News 等）
#            3 = 聚合索引（仅作兜底，可信度权重最低）
#   kind      rss = RSS/Atom 订阅（D1 已实现）
#            html = HTML 列表页（D3 之后实现，现统一 enabled: false）
#   enabled   是否参与采集
#   max_items 每个源单次最多取多少条（新华网/军网是历史全量 feed，
#             必须限流，否则首轮会灌进几千条）
#
# 合规约定：
#   仅采集公开发布内容；RSS 优先；遵守 robots.txt 与源站服务条款；
#   不绕过反爬、不高频请求；仅本地存档用于生成摘要，不分发原文。

